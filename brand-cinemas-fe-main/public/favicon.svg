<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- CinemaID Signature Gold Gradient -->
    <linearGradient id="cinemaIdGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE182"/>
      <stop offset="25%" stop-color="#E8B038"/>
      <stop offset="65%" stop-color="#C49622"/>
      <stop offset="100%" stop-color="#7A5C12"/>
    </linearGradient>

    <!-- Subtle Premium Gold Accent Border -->
    <linearGradient id="cinemaBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B038" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#C49622" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7A5C12" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Cinematic Deep Radial Dark Background -->
    <radialGradient id="cinemaDarkBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1912"/>
      <stop offset="60%" stop-color="#101011"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#cinemaDarkBg)" stroke="url(#cinemaBorder)" stroke-width="1.8"/>

  <!-- Pure Vector "ID" Monogram (Zero font dependency, pixel-crisp at any size) -->
  <g fill="url(#cinemaIdGold)" fill-rule="evenodd">
    <!-- Letter "I" -->
    <rect x="15" y="19" width="7.2" height="26" rx="1.2"/>

    <!-- Letter "D" with smooth inner and outer geometric curve -->
    <path d="M 26.8 20.2 C 26.8 19.54 27.34 19 28 19 L 39 19 C 45.6 19 50 23.5 50 32 C 50 40.5 45.6 45 39 45 L 28 45 C 27.34 45 26.8 44.46 26.8 43.8 Z M 33.8 25.2 L 33.8 38.8 L 38.4 38.8 C 41.8 38.8 43.6 36.3 43.6 32 C 43.6 27.7 41.8 25.2 38.4 25.2 Z"/>
  </g>
</svg>
